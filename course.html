<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Course - Strumly</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="nav">
      <div class="nav-inner">
        <a class="logo" href="index.html">Strumly</a>
        <div class="search-wrap">
          <svg
            class="search-icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            id="globalSearch"
            class="search"
            placeholder="Search courses, instructors, songs..."
            aria-label="Search"
          />
        </div>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="index.html#features">Features</a>
          <a href="auth.html" class="btn outline">Log In</a>
          <a href="auth.html" class="btn primary">Sign Up</a>
        </nav>
      </div>
    </header>

    <main id="courseMain" class="course-page section-padding"></main>

    <footer class="footer">
      <div class="footer-inner">
        <div class="brand-footer">
          <div class="logo">Strumly</div>
          <p class="muted small" style="margin: 4px 0 0 0">
            &copy; <span id="year">2026</span> All rights reserved.
          </p>
        </div>
        <div class="credits muted small">
          Images: Unsplash. UI icons: Feather Icons.<br />
        </div>
      </div>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="js/courses.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
